<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigPlanetarium | Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="loadingscreen/style.css">
</head>
<body>
    <div id="loadingScreen" class="overlay">
        <main class="center">
            <h1 class="title">Looking through the telescope</h1>
            <div id="distanceText" class="distance" aria-live="polite">0 KM</div>
            <p id="statusText" class="note">GETTING READY...</p>
        </main>
        <footer class="footer">
            <h2 class="label">Did you know?</h2>
            <p id="factText" class="text" aria-live="polite">Space is waiting for you!</p>
        </footer>
    </div>
    <script src="loadingscreen/script.js"></script>
</body>
</html>
